logger: { file: { path: /opt/open5gs/var/log/open5gs/nssf.log } }
global:
nssf:
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/nssf.key
        cert: /opt/open5gs/etc/open5gs/tls/nssf.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
  sbi:
    server:
    - address: 172.22.0.27
      port: 7777
    client:
      scp:
      - uri: https://scp:7777
      nsi:
      - uri: https://nrf:7777
        s_nssai: { sst: 1 }
