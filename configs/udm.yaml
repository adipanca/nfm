logger: { file: { path: /opt/open5gs/var/log/open5gs/udm.log } }
global:
udm:
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/udm.key
        cert: /opt/open5gs/etc/open5gs/tls/udm.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
  sbi:
    server:
    - address: 172.22.0.23
      port: 7777
    client:
      scp:
      - uri: https://scp:7777
