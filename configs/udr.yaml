logger: { file: { path: /opt/open5gs/var/log/open5gs/udr.log } }
global:
udr:
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/udr.key
        cert: /opt/open5gs/etc/open5gs/tls/udr.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
  sbi:
    server:
    - address: 172.22.0.24
      port: 7777
    client:
      scp:
      - uri: https://scp:7777
  db_uri: mongodb://mongo/open5gs
