# AMF — Access & Mobility. SBI di cp, NGAP(N2) di ran menghadap gNB.
logger: { file: { path: /opt/open5gs/var/log/open5gs/amf.log } }
global:
amf:
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/amf.key
        cert: /opt/open5gs/etc/open5gs/tls/amf.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
  sbi:
    server:
    - address: 172.22.0.28
      port: 7777
    client:
      scp:
      - uri: https://scp:7777
  ngap:
    server:
    - address: 172.23.0.32      # N2 menghadap gNB (SCTP 38412)
  metrics:
    server:
    - address: 172.22.0.28
      port: 9090
  guami:
  - plmn_id: { mcc: 999, mnc: 70 }
    amf_id: { region: 2, set: 1 }
  tai:
  - plmn_id: { mcc: 999, mnc: 70 }
    tac: 1
  plmn_support:
  - plmn_id: { mcc: 999, mnc: 70 }
    s_nssai:
    - sst: 1
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name: { full: Open5GS, short: Next }
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540   # 9 menit — wajib ada di Open5GS 2.7.5
