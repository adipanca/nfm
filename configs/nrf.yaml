# NRF — NF Repository. Single-homed di cp. Registrasi semua NF.
logger: { file: { path: /opt/open5gs/var/log/open5gs/nrf.log } }
global:
nrf:
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/nrf.key
        cert: /opt/open5gs/etc/open5gs/tls/nrf.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
  serving:
  - plmn_id: { mcc: 999, mnc: 70 }
  sbi:
    server:
    - address: 172.22.0.20
      port: 7777
