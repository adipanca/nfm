# SMF — Session Management. SBI di cp, PFCP(N4) di ran menuju UPF.
logger: { file: { path: /opt/open5gs/var/log/open5gs/smf.log } }
global:
smf:
  default:
    tls:
      server:
        scheme: https
        private_key: /opt/open5gs/etc/open5gs/tls/smf.key
        cert: /opt/open5gs/etc/open5gs/tls/smf.crt
      client:
        scheme: https
        cacert: /opt/open5gs/etc/open5gs/tls/ca.crt
  sbi:
    server:
    - address: 172.22.0.29
      port: 7777
    client:
      scp:
      - uri: https://scp:7777
  pfcp:
    server:
    - address: 172.23.0.31      # N4
    client:
      upf:
      - address: 172.23.0.30    # UPF N4
  gtpc:
    server:
    - address: 172.23.0.31
  gtpu:
    server:
    - address: 172.23.0.31
  metrics:
    server:
    - address: 172.22.0.29
      port: 9090
  session:
  - subnet: 10.45.0.0/16
    gateway: 10.45.0.1
    dnn: internet
  dns:
  - 172.24.0.11                  # DNS lab di data network (bukan internet)
  mtu: 1400
