# UPF — User Plane. N4(PFCP)+N3(GTP-U) di ran, N6 ke data network.
logger: { file: { path: /opt/open5gs/var/log/open5gs/upf.log } }
global:
upf:
  pfcp:
    server:
    - address: 172.23.0.30      # N4
  gtpu:
    server:
    - address: 172.23.0.30      # N3 menghadap gNB
  session:
  - subnet: 10.45.0.0/16
    gateway: 10.45.0.1
    dnn: internet
  metrics:
    server:
    - address: 172.23.0.30
      port: 9090
